<!DOCTYPE html>
<html>
<head>
<title>Student Form</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, indigo, mediumorchid);
    margin:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.box{
    width:380px;
    background: rgba(255,255,255,0.1);
    padding:40px;
    border-radius:25px;
    box-shadow:0 0 15px black;
}

h3{
    text-align:center;
    font-size:35px;
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    background:lavender;
    color:indigo;
    border:none;
    padding:12px;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:white;
}

#out{
    margin-top:15px;
    font-size:18px;
}

p{
    margin-top:20px;
}

a{
    color:lavender;
    text-decoration:none;
    margin:15px;
    font-size:20px;
}

a:hover{
    color:white;
    text-decoration:underline;
}

</style>

<script>

function showData(e){

    e.preventDefault();

    let n = document.getElementById("name").value;
    let u = document.getElementById("usn").value;
    let em = document.getElementById("email").value;
    let b = document.getElementById("branch").value;

    let sub = document.getElementById("sub");

    let s = "";

    for(let i=0; i<sub.length; i++){

        if(sub[i].selected){

            s += sub[i].value + ", ";
        }
    }

    if(n==""){

        alert("Enter Name");

        return;
    }

    if(u.length != 10){

        alert("USN must be 10 characters");

        return;
    }

    if(em=="" || !em.includes("@")){

        alert("Enter Valid Email");

        return;
    }

    document.getElementById("out").innerHTML =

    "<b>Details:</b><br><br>" +

    "Name : " + n + "<br>" +

    "USN : " + u + "<br>" +

    "Email : " + em + "<br>" +

    "Branch : " + b + "<br>" +

    "Subjects : " + s;
}

</script>
</head>

<body>

<div class="box">

<h3>Student Form</h3>

<form onsubmit="showData(event)">

<input type="text" id="name" placeholder="Enter Name">

<input type="text" id="usn" placeholder="Enter USN">

<input type="text" id="email" placeholder="Enter Email">

<select id="branch">

<option value="">Select Branch</option>

<option>CSE</option>

<option>ECE</option>

<option>CS-AIML</option>

<option>IS</option>

</select>

<select id="sub" multiple size="4">

<option>OS</option>

<option>Maths</option>

<option>DAA</option>

<option>Embedded</option>

</select>

<button type="submit">Submit</button>

</form>

<div id="out"></div>

</div>

<p>

<a href="https://sanikagowda24.github.io/sem4-fet">
Go to HomePage
</a>

<a href="https://sanikagowda24.github.io/sem4-fet/assignments/two_css_js.html">
2 JavaScript
</a>

</p>

</body>
</html>
