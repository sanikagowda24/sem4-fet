<!DOCTYPE html>
<html>
<head>
  <title>Skills Lists</title>
</head>

<body>

<h2>Skills Matrix (Interactive Version Fixed)</h2>

<ol>
  <li>FRONTEND DEVELOPMENT
    <ul>
      <li id="f1">HTML5</li>
      <li id="f2">CSS</li>
      <li id="f3">JavaScript</li>
    </ul>
  </li>

  <li>STYLING & FRAMEWORK
    <ul>
      <li id="s1">Bootstrap</li>
      <li id="s2">Tailwind CSS</li>
    </ul>
  </li>

  <li>TOOLS & PLATFORMS
    <ul>
      <li id="t1">Git</li>
      <li id="t2">GitHub</li>
      <li id="t3">VS Code</li>
    </ul>
  </li>
</ol>

<br>

<button onclick="changeSkill()">CLICK TO CHANGE SKILL</button>

<script>
function changeSkill(){

    let category = prompt("Select Category:\n1 - Frontend\n2 - Styling\n3 - Tools");

    if(!category) return;

    category = category.trim();

    let id = "";
    let i;

    if(category == "1"){
        i = prompt("Select Skill:\n1 - HTML5\n2 - CSS\n3 - JavaScript");
        if(!i) return;
        i = i.trim();

        if(i == "1") id = "f1";
        else if(i == "2") id = "f2";
        else if(i == "3") id = "f3";
        else {
            alert("Invalid skill selection");
            return;
        }
    }

    else if(category == "2"){
        i = prompt("Select Skill:\n1 - Bootstrap\n2 - Tailwind CSS");
        if(!i) return;
        i = i.trim();

        if(i == "1") id = "s1";
        else if(i == "2") id = "s2";
        else {
            alert("Invalid skill selection");
            return;
        }
    }

    else if(category == "3"){
        i = prompt("Select Skill:\n1 - Git\n2 - GitHub\n3 - VS Code");
        if(!i) return;
        i = i.trim();

        if(i == "1") id = "t1";
        else if(i == "2") id = "t2";
        else if(i == "3") id = "t3";
        else {
            alert("Invalid skill selection");
            return;
        }
    }

    else {
        alert("Invalid category selection");
        return;
    }

    let newSkill = prompt("Enter new skill:");
    if(!newSkill || newSkill.trim() === ""){
        alert("Invalid input");
        return;
    }

    document.getElementById(id).innerHTML = newSkill;

    alert("Skill updated successfully!");
}
</script>

</body>
</html>
