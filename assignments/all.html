<html>
  <head>
    <title>MY PORTFOLIO</title>
  </head>
  <style>
    body{
      font-family:arial;
      text-align:center;
      background-color:lavender;
    }
    h2{
      font-size:40px;
      text-align:center;
    }
    .container{
      background-color:white;
      margin:auto;
      width:420px;
      padding:30px;
      border-radius:15px;
    }
    input{
        background-color:lightyellow;
        padding:20px;
        width:200px;
        margin:10px;
       }
    button{
        display:block;
        margin:auto;
        margin-top:10px;
      }
  </style>
  <body>
    <div class="container">
    <h1 style="color:black;">Addition Calculator</h1>
    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number">
     <button onclick="addNumbers()">Calculate</button>
    <h2 id="result"style="font-size:25px;">result: </h2>
    </div>
  <script>
  function addNumbers() {
    let n1 = Number(document.getElementById('num1').value);
    let n2 = Number(document.getElementById('num2').value);
    let add=n1+n2;
    document.getElementById('result').innerHTML = "result: " +add;
  }
</script>
</body>
</html>
