<!DOCTYPE html>
<html>
<head>
<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, indigo, mediumorchid);
    color:white;
}

h2{
    font-size:40px;
}

.buttons{
    display:flex;
    gap:15px;
}

.container{
    position: relative;
    width: 220px;
    height: 220px;
}

.box{
    width: 200px;
    height: 200px;
    position: absolute;
    border: 3px solid white;
    border-radius: 15px;
    transition: all 0.3s ease;
    z-index:1;
    box-shadow:0 0 15px black;
}

#red{
    background-color: lightcoral;
    top:0;
    left:0;
}

#blue{
    background-color: lightskyblue;
    top:20px;
    left:20px;
}

#green{
    background-color: mediumseagreen;
    top:40px;
    left:40px;
}

button{
    padding:10px 18px;
    cursor:pointer;
    font-weight:bold;
    border:none;
    border-radius:10px;
    background-color: lavender;
    color:indigo;
    font-size:16px;
}

button:hover{
    background-color:white;
}

p{
    margin-top:30px;
}

a{
    color:lavender;
    text-decoration:none;
    margin:15px;
    font-size:20px;
}

a:hover{
    color:white;
    text-decoration:underline;
}

</style>
</head>

<body>

<h2>Layer Shifter</h2>

<div class="buttons">

    <button onclick="bringToFront('red')">
        Red to Front
    </button>

    <button onclick="bringToFront('blue')">
        Blue to Front
    </button>

    <button onclick="bringToFront('green')">
        Green to Front
    </button>

</div>

<div class="container">

    <div id="red" class="box"></div>

    <div id="blue" class="box"></div>

    <div id="green" class="box"></div>

</div>

<script>

let topLayer = 10;

function bringToFront(id){

    const targetBox = document.getElementById(id);

    topLayer++;

    targetBox.style.zIndex = topLayer;
}

</script>

<p>

<a href="https://sanikagowda24.github.io/sem4-fet">
Go to HomePage
</a>

<a href="https://sanikagowda24.github.io/sem4-fet/assignments/four_css_js.html">
4 JavaScript
</a>

</p>

</body>
</html>
