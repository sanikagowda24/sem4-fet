<!DOCTYPE html>
<html>

<head>

<title>ATM Loop Demo</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, indigo, mediumorchid);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    height:100vh;
    color:white;
}

.atm-container{
    background: rgba(255,255,255,0.1);
    padding:45px;
    border-radius:25px;
    box-shadow:0 0 15px black;
    text-align:center;
    width:350px;
}

h2{
    font-size:40px;
    color:lavenderblush;
    margin-bottom:15px;
}

p{
    font-size:18px;
    margin-bottom:25px;
}

button{
    background:lavender;
    color:indigo;
    border:none;
    padding:14px 25px;
    font-size:18px;
    font-weight:bold;
    border-radius:12px;
    cursor:pointer;
    width:100%;
}

button:hover{
    background:white;
}

a{
    color:lavender;
    text-decoration:none;
    margin:15px;
    font-size:20px;
}

a:hover{
    color:white;
    text-decoration:underline;
}

</style>

</head>

<body>

<div class="atm-container">

<h2>Secure ATM</h2>

<p>
Click the button below to start your transaction loop.
</p>

<button onclick="startATM()">
Open ATM Menu
</button>

</div>

<script>

function startATM(){

    let balance = 500;

    let choice;

    do{

        choice = prompt(
        "ATM MENU\n1. Check Balance\n2. Withdraw $100\n3. Exit"
        );

        if(choice === "1"){

            alert("Current Balance: $" + balance);
        }

        else if(choice === "2"){

            if(balance >= 100){

                let withdrawn = 0;

                while(withdrawn < 100){

                    withdrawn += 20;

                    console.log("Dispensing... $" + withdrawn);
                }

                balance -= 100;

                alert("Success! New balance: $" + balance);
            }

            else{

                alert("Error: Insufficient funds!");
            }
        }

    }

    while(choice !== "3" && choice !== null);

    alert("Thank you for using our ATM!");
}

</script>

</body>

</html>
